plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

dependencies {
    implementation project(':scribble-shared')
}

javafx {
    version = '17.0.8'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'com.scribble.client.ClientApp'
}
